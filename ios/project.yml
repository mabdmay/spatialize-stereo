# Fallback project definition for XcodeGen.
#
# SpatializeStereo.xcodeproj is committed and should open directly in Xcode 16+.
# If your Xcode is older, or the committed project misbehaves, regenerate it:
#
#     brew install xcodegen
#     cd ios && xcodegen generate
#
name: SpatializeStereo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SpatializeStereo:
    type: application
    platform: iOS
    sources:
      - path: SpatializeStereo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SpatializeStereo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        # Core Motion crashes the app on first use if this key is missing.
        INFOPLIST_KEY_NSMotionUsageDescription: "Head tracking keeps the virtual speaker anchored in the room as you turn your head."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
